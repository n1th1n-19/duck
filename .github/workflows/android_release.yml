name: Android release

# Push a tag like v1.18.2-duck.3 to build, sign and publish a pre-release.
# Run manually (workflow_dispatch) to build and download the APKs without publishing.
on:
  push:
    tags: ["v*-duck.*"]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.41.9"
  # SHA-256 of the Duck Share release certificate. A build signed with anything else fails.
  CERT_SHA256: "e7f5f7ff9c85f117b535d0f4179b4523d8a83d7a8b847f63122149bbd98cb304"

# Actions are pinned to commit SHAs: the build job holds the signing key.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.package.outputs.name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      # Only after all third-party setup: nothing but the build sees the key.
      - name: Signing key
        env:
          KEY_STORE: ${{ secrets.ANDROID_KEY_STORE }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEY_STORE" && test -n "$KEY_PASSWORD" || { echo "::error::Secrets ANDROID_KEY_STORE / ANDROID_KEY_PASSWORD are missing"; exit 1; }
          echo "$KEY_STORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=duckshare\nstoreFile=%s\n' \
            "$KEY_PASSWORD" "$KEY_PASSWORD" "$RUNNER_TEMP/release.jks" > app/android/key.properties

      - name: Build APKs
        working-directory: app
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" app/android/key.properties

      - name: Package and verify
        id: package
        run: |
          VERSION=$(sed -n 's/^version: \([0-9.]*\).*/\1/p' app/pubspec.yaml)
          case "$GITHUB_REF_NAME" in v*-duck.*) NAME="${GITHUB_REF_NAME#v}" ;; *) NAME="$VERSION-dev.$(git rev-parse --short HEAD)" ;; esac
          OUT=dist; mkdir -p $OUT
          SRC=app/build/app/outputs/flutter-apk
          cp $SRC/app-arm64-v8a-release.apk   $OUT/duck-share-$NAME-arm64-v8a.apk
          cp $SRC/app-armeabi-v7a-release.apk $OUT/duck-share-$NAME-armeabi-v7a.apk
          cp $SRC/app-x86_64-release.apk      $OUT/duck-share-$NAME-x86_64.apk
          cp $SRC/app-release.apk             $OUT/duck-share-$NAME-universal.apk
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          for apk in $OUT/*.apk; do
            $APKSIGNER verify --print-certs "$apk" | grep -q "SHA-256 digest: $CERT_SHA256" \
              || { echo "::error::$apk is not signed with the Duck Share key"; exit 1; }
          done
          (cd $OUT && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          # The release notes come from the "## Duck Share (unreleased)" section of the changelog.
          awk '/^## Duck Share/{f=1; next} /^## /{f=0} f' app/assets/CHANGELOG.md > $OUT/notes.md
          printf '\n> [!NOTE]\n> **Play Protect warning?** Duck Share is a new independent app. Tap **More details → Install anyway**. Most phones need **arm64-v8a**.\n\nBuilt by [this workflow run](%s) from %s. Certificate SHA-256: `%s`\n' \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$GITHUB_SHA" "$CERT_SHA256" >> $OUT/notes.md
          echo "name=$NAME" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: duck-share-apks
          path: dist/*

  # Separate job: write access to releases, but no signing key and no third-party code.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: duck-share-apks
          path: dist

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ needs.build.outputs.name }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease --title "Duck Share $NAME" \
            --notes-file dist/notes.md dist/*.apk dist/SHA256SUMS.txt
